# Render Blueprint for the UIUC Course Explorer Data Agent.
#
# Database is external Neon Postgres, not a Render-managed database - see
# DECISIONS.md for why (Render's own free Postgres expires after 30 days;
# Neon's free tier doesn't). Set DATABASE_URL to your Neon connection string
# in the Render dashboard after the first deploy (it's marked `sync: false`
# below, so Render won't try to auto-generate it).
#
# The build step also pre-downloads the local embedding model
# (BAAI/bge-small-en-v1.5, via fastembed) into ./model_cache so it's already
# on disk before the app ever serves a request - see the cold-start
# reasoning in DECISIONS.md. api.py's startup event then loads it from that
# cache in ~1s instead of the ~30-90s a cold download takes.

services:
  - type: web
    name: uiuc-course-explorer-agent
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "from app.embeddings import warmup; warmup()"
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api
    envVars:
      # Required. Neon connection string (postgres://... - the app rewrites it
      # to the psycopg2 form itself). Set in the Render dashboard after the
      # first deploy.
      - key: DATABASE_URL
        sync: false
      # Recommended. A Neon role with only SELECT granted - the LLM agent's
      # SQL tool uses this if set, so a jailbreak can't run DDL/DML. See
      # DEPLOYMENT.md "Read-only role for the assistant". Falls back to
      # DATABASE_URL when unset.
      - key: DATABASE_URL_RO
        sync: false
      # Required for the /ask assistant. Free key from console.groq.com.
      # GEMINI_API_KEY / OPENAI_API_KEY are optional fallbacks, tried in that
      # order only if GROQ_API_KEY is unset (see app/agent.py).
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Optional. Enables GET /admin/ask-log (recent assistant activity). The
      # endpoint 404s while this is unset. Use a long random string.
      - key: ADMIN_TOKEN
        sync: false
      # Optional guardrail tuning for /ask (see app/ask_log.py). Defaults:
      # per-IP 10/hour and 40/day, a shared 250/day cap across all clients
      # (the real budget backstop - per-IP keys on a spoofable header), and a
      # 500-char question cap.
      - key: ASK_RATE_PER_HOUR
        sync: false
      - key: ASK_RATE_PER_DAY
        sync: false
      - key: ASK_GLOBAL_PER_DAY
        sync: false
      - key: ASK_MAX_CHARS
        sync: false
      # Optional. Set to any value to expose /docs, /redoc, /openapi.json.
      # Off by default - it's an information-disclosure surface.
      - key: ENABLE_DOCS
        sync: false
      # Optional. Multi-query expansion for the RAG tool (course_content_search):
      # one extra LLM call rewrites the topic + adds RAG_SUBQUERIES facets,
      # each searched and RRF-merged. Set RAG_MULTIQUERY=0 to disable and fall
      # back to a single-query search. Defaults: on, 3 sub-queries, k=6 per
      # query, 10 merged results. See app/agent.py and DECISIONS.md.
      - key: RAG_MULTIQUERY
        sync: false
      - key: RAG_SUBQUERIES
        sync: false
      - key: RAG_K_PER
        sync: false
      - key: RAG_K_RETURN
        sync: false
