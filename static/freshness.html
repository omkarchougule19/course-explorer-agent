<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Freshness — UIUC Course Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=EB+Garamond:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="banner">
  <div class="wrap">
    <h1><a href="/">UIUC Course Explorer</a></h1>
    <p class="subtitle">How current each subject and term's data is. Nothing here is live.</p>
  </div>
</header>

<div class="wrap">

  <div class="panel" style="margin-top: var(--s6);">
    <h2>Last Updated, Per Subject / Term</h2>
    <p class="hint">
      Each row shows when that subject and term was last updated.
      <span class="fresh">Green</span> = within 35 days.
      <span class="stale">Red</span> = over 70 days old.
    </p>
    <div class="results-wrap" id="freshness-wrap">
      <p class="empty-state">loading...</p>
    </div>
  </div>

  <footer>
    course-explorer-agent &middot; <a href="/">&larr; back to explorer</a> &middot; <a href="/api">API info</a>
  </footer>

</div>

<script src="/time.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  async function getJSON(url) {
    const res = await fetch(url);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(body.detail || `Request failed (${res.status})`);
      throw err;
    }
    return body;
  }

  function ageInDays(sqliteTimestamp) {
    return (Date.now() - parseUtc(sqliteTimestamp).getTime()) / 86400000;
  }

  function ageClass(sqliteTimestamp) {
    const days = ageInDays(sqliteTimestamp);
    if (days < 35) return 'fresh';
    if (days > 70) return 'stale';
    return '';
  }

  function renderFreshness(rows) {
    const wrap = $('freshness-wrap');
    if (!rows.length) {
      wrap.innerHTML = '<p class="empty-state">No data yet. Run the scraper, then reload this page.</p>';
      return;
    }
    let html = '<table><thead><tr>'
      + '<th>Subject</th><th>Term</th><th>Sections</th><th>Last Updated</th>'
      + '</tr></thead><tbody>';
    for (const row of rows) {
      const cls = ageClass(row.last_updated);
      const abs = row.last_updated ? parseUtc(row.last_updated).toLocaleString() : '—';
      html += `<tr>`
        + `<td>${esc(row.subject)}</td>`
        + `<td>${esc(row.semester)} ${Number(row.year) || ''}</td>`
        + `<td>${Number(row.section_count) || 0}</td>`
        + `<td class="${cls}" title="${esc(abs)}">${esc(formatRelativeTime(row.last_updated))}</td>`
        + `</tr>`;
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  async function loadFreshness() {
    try {
      const data = await getJSON('/freshness');
      renderFreshness(data.freshness || []);
    } catch (e) {
      $('freshness-wrap').innerHTML = `<p class="empty-state">Couldn't load freshness data: ${e.message}</p>`;
    }
  }

  loadFreshness();
</script>
</body>
</html>
