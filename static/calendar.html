<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Calendar — Illini Course Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Roboto:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="banner">
  <div class="wrap">
    <h1><a href="/">Illini Course Copilot</a></h1>
    <p class="subtitle">Add/drop deadlines, breaks, and finals — straight from the registrar's per-term calendar.</p>
  </div>
</header>

<nav class="site-nav">
  <div class="wrap">
    <a href="/">Home</a>
    <a href="/departments.html">Departments</a>
    <a href="/calendar.html" class="active">Calendar</a>
    <a href="/freshness.html">Data Freshness</a>
    <a href="/about.html">How It Works</a>
  </div>
</nav>

<div class="wrap">

  <div class="field-row" style="margin: var(--s6) 0 var(--s5);">
    <div class="field" style="flex: 0 1 200px;">
      <label for="cal-term">Term</label>
      <select id="cal-term"></select>
    </div>
    <div class="field" style="flex: 0 1 200px;">
      <label for="cal-category">Category</label>
      <select id="cal-category">
        <option value="">All categories</option>
        <option value="instruction">Instruction</option>
        <option value="add">Add</option>
        <option value="drop">Drop</option>
        <option value="withdraw">Withdraw</option>
        <option value="break">Break</option>
        <option value="holiday">Holiday</option>
        <option value="finals">Finals</option>
        <option value="grades">Grades</option>
        <option value="registration">Registration</option>
        <option value="commencement">Commencement</option>
        <option value="other">Other</option>
      </select>
    </div>
  </div>

  <div id="cal-wrap"><p class="empty-state">loading…</p></div>

  <footer>
    Illini Course Copilot &middot; <a href="/">&larr; back to explorer</a> &middot; <a href="/api">API info</a>
  </footer>

</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  const CURRENT_TERM = 'fall 2026';  // keep in sync with app/terms.py

  async function getJSON(url) {
    const res = await fetch(url);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || `Request failed (${res.status})`);
    return body;
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function renderEvents(events) {
    const wrap = $('cal-wrap');
    if (!events.length) {
      wrap.innerHTML = '<p class="empty-state">No calendar events loaded for this term yet.</p>';
      return;
    }
    const byDate = new Map();
    for (const ev of events) {
      const key = ev.event_date || ev.raw_date || 'Undated';
      if (!byDate.has(key)) byDate.set(key, []);
      byDate.get(key).push(ev);
    }
    let html = '';
    for (const [date, evs] of byDate) {
      html += `<div class="cal-day"><h3>${esc(formatDate(date) || date)}</h3><div class="cal-events">`;
      for (const ev of evs) {
        html += `<div class="cal-event"><span class="cal-cat">${esc(ev.category || '')}</span>`
          + `<span class="cal-title">${esc(ev.title || '')}</span></div>`;
      }
      html += '</div></div>';
    }
    wrap.innerHTML = html;
  }

  async function loadCalendar() {
    const wrap = $('cal-wrap');
    wrap.setAttribute('aria-busy', 'true');
    const [year, semester] = $('cal-term').value.split('|');
    const category = $('cal-category').value;
    const params = new URLSearchParams();
    if (year) params.set('year', year);
    if (semester) params.set('semester', semester);
    if (category) params.set('category', category);
    try {
      const data = await getJSON('/calendar?' + params.toString());
      renderEvents(data.events || []);
    } catch (e) {
      wrap.innerHTML = `<p class="empty-state">Couldn't load the calendar: ${esc(e.message)}</p>`;
    }
  }

  async function loadTerms() {
    try {
      const stats = await getJSON('/stats');
      const select = $('cal-term');
      const order = { spring: 0, summer: 1, fall: 2 };
      const terms = (stats.terms_covered || []).slice().sort((a, b) => {
        const [sa, ya] = a.split(' '), [sb, yb] = b.split(' ');
        return (yb - ya) || (order[sb] - order[sa]);
      });
      for (const t of terms) {
        const [sem, yr] = t.split(' ');
        const opt = document.createElement('option');
        opt.value = `${yr}|${sem}`;
        opt.textContent = t;
        if (t === CURRENT_TERM) opt.selected = true;
        select.appendChild(opt);
      }
    } catch (e) { /* leaves the select empty; loadCalendar still runs with no filter */ }
  }

  $('cal-term').addEventListener('change', loadCalendar);
  $('cal-category').addEventListener('change', loadCalendar);

  (async () => {
    await loadTerms();
    loadCalendar();
  })();
</script>
</body>
</html>
